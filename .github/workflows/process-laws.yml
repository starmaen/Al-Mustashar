name: معالجة القوانين من Google Drive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/process-laws.yml'
      - 'ocr_worker.py'

permissions:
  contents: write

jobs:
  process-laws:
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: تثبيت أدوات النظام
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara poppler-utils

      - name: تثبيت مكتبات بايثون
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib pytesseract pdf2image

      - name: تشغيل معالج القوانين
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python ocr_worker.py

      - name: رفع الملفات المستخرجة إلى المستودع
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/laws/
          git diff --staged --quiet || git commit -m "تحديث القوانين تلقائيًا [skip ci]"
          git push
