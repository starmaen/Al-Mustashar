name: Build Al-Mustashar APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Ensure stable release keystore (auto-created once)
      run: |
        if [ ! -f app/keystore.jks ]; then
          keytool -genkeypair -keystore app/keystore.jks -alias al-mustashar -keyalg RSA -keysize 2048 -validity 10950 -storepass "AlMustashar#Store2026!" -keypass "AlMustashar#Key2026!" -dname "CN=Al-Mustashar, OU=Legal, O=Maen, L=Damascus, ST=Damascus, C=SY"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f app/keystore.jks
          git commit -m "تثبيت مفتاح التوقيع الثابت [skip ci]" || true
          git push || true
        fi
        echo "===== بصمة التوقيع (انسخ SHA1 إلى Firebase) ====="
        keytool -list -v -keystore app/keystore.jks -storepass "AlMustashar#Store2026!" | grep -E "SHA1:|SHA256:" || true

    - name: Build APK
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY1 }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY1 }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Al-Mustashar-Debug
        path: app/build/outputs/apk/debug/app-debug.apk