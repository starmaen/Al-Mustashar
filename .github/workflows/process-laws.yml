name: معالجة القوانين من Google Drive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/process-laws.yml'
      - 'ocr_worker.py'

permissions:
  contents: write

jobs:
  process-laws:
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: تثبيت أدوات النظام
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: تحميل نموذج tessdata_best للعربية
        run: |
          sudo mkdir -p /usr/share/tesseract-ocr/5/tessdata
          cd /tmp
          wget -q https://github.com/tesseract-ocr/tessdata_best/raw/main/ara.traineddata
          wget -q https://github.com/tesseract-ocr/tessdata_best/raw/main/eng.traineddata
          sudo cp ara.traineddata /usr/share/tesseract-ocr/5/tessdata/
          sudo cp eng.traineddata /usr/share/tesseract-ocr/5/tessdata/
          echo "TESSDATA_PREFIX=/usr/share/tesseract-ocr/5/tessdata" >> $GITHUB_ENV

      - name: تثبيت مكتبات بايثون
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib pytesseract pdf2image PyMuPDF firebase-admin

      - name: تنظيف الملفات القديمة مع حفظ سجل التخطي
        # حذف ملفات القوانين فقط وإبقاء _manifest.json ليعمل تخطي الملفات غير المتغيرة
        # (الأمر القديم rm -rf data/laws/* كان يحذف السجل فيعيد معالجة كل شيء كل مرة)
        run: find data/laws -maxdepth 1 -name '*.json' ! -name '_manifest.json' -delete

      - name: تشغيل معالج القوانين
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python ocr_worker.py

      - name: حفظ النواتج في المستودع أولاً (قبل مزامنة Firestore)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/laws/
          git diff --staged --quiet || git commit -m "تحديث القوانين تلقائيًا [skip ci]"
          git push

      - name: الرفع التلقائي إلى Firestore (لا يوقف السير عند فشله)
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: al-mustashar-7f6b7
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then echo "auth: FIREBASE_SERVICE_ACCOUNT_JSON"; else echo "auth: fallback GDRIVE_SERVICE_ACCOUNT_JSON (يحتاج صلاحية Firestore!)"; fi
          python sync_laws_to_firestore.py || echo "⚠️ فشلت مزامنة Firestore — أضف Secret بمفتاح خدمة من Firebase Console (إعدادات المشروع ← حسابات الخدمة ← إنشاء مفتاح خاص)"
